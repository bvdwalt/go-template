name: Release

on:
  workflow_run: # after CI passed on main
    workflows: ["CI"]
    types: [completed]
    branches: ["main"]
  workflow_dispatch: # publish the latest tag again, after a failed release

permissions:
  contents: write
  packages: write

concurrency: release

jobs:
  release:
    if: >-
      github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }} # the commit CI tested

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Install svu
        run: go install github.com/caarlos0/svu/v3@v3.4.0

      - name: Tag the next version, if the commits call for one
        id: tag
        run: |
          current=$(svu current)
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            if ! git rev-parse -q --verify "refs/tags/$current" > /dev/null; then
              echo "No tag to release yet"
              exit 1
            fi
            git checkout -q "$current"
            echo "tag=$current" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          next=$(svu next --v0)
          if [ "$next" = "$current" ]; then
            echo "No release needed (current: $current)"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$next"
          git push origin "$next"
          echo "tag=$next" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        if: steps.tag.outputs.tag != '' && hashFiles('web/package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend
        if: steps.tag.outputs.tag != '' && hashFiles('web/package.json') != ''
        # vite empties web/dist, so restore the tracked placeholder or goreleaser sees a dirty tree
        run: cd web && npm install && npm run build && touch dist/.gitkeep

      - name: Set up Docker Buildx
        if: steps.tag.outputs.tag != ''
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.tag.outputs.tag != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        if: steps.tag.outputs.tag != ''
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        if: steps.tag.outputs.tag != ''
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
